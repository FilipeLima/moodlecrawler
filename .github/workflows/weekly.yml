name: AVA Crawler Semanal

on:
  # Execução semanal.
  # O horário pode ser alterado conforme sua preferência.
  # Exemplo abaixo: sábado às 12:17 (horário UTC).
  schedule:
    - cron: "17 15 * * 6"

  # Permite executar manualmente pelo GitHub Actions.
  workflow_dispatch:

jobs:
  crawler:
    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar crawler semanal
        env:
          USUARIO: ${{ secrets.USUARIO }}
          SENHA: ${{ secrets.SENHA }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python weekly_crawler.py
